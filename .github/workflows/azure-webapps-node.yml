name: Build, Test & CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: fixflow
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Push database schema
      working-directory: server
      run: npx prisma db push
      env:
        DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/fixflow

    - name: Build production bundle
      run: npm run build

    - name: Run server tests
      working-directory: server
      run: npm test
      env:
        DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/fixflow
        JWT_SECRET: fixflow_ci_test_jwt_secret_key_minimum_32_characters
        SMTP_USER: ci_test@example.com
        SMTP_PASS: ci_test_app_password
        CLIENT_URL: http://localhost:5173

    - name: Run client tests
      working-directory: client
      run: npm test -- --reporter=verbose
